<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Okey Masası - Bulut & İstatistik</title>
    
    <!-- Koyu Tema için Flash of Unstyled Content (FOUC) önleyici -->
    <script>
        // Varsayılan olarak açık (light) tema ile başlasın
        if (localStorage.getItem('okey_theme') === 'dark') {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        okey: { 50: '#f0fdf4', 100: '#dcfce7', 200: '#bbf7d0', 300: '#86efac', 400: '#4ade80', 500: '#22c55e', 600: '#16a34a', 700: '#15803d', 800: '#166534', 900: '#14532d' },
                        // Koyu tema için daha "Orijinal" ve premium gece yarısı tonları
                        slate: {
                            700: '#272d38', 
                            800: '#161920', 
                            900: '#0c0e12'
                        }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; transition: background-color 0.3s, color 0.3s; }
        /* Daha doygun ve derin bir koyu tema arka planı */
        html.dark body { background-color: #0c0e12; color: #f1f5f9; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase API'lerini React (Babel) ortamında kullanabilmek için global pencereye aktarıyoruz
        window.FirebaseAPI = { doc, getDoc, setDoc, onSnapshot, collection, deleteDoc, onAuthStateChanged };
        
        // === GITHUB İÇİN GÜVENLİ VERİTABANI ALANI ===
        // Kendi bulut veritabanınızı (Firebase) kurmak isterseniz, aşağıdaki "null" değerini silip
        // Firebase'in size verdiği ayar objesini buraya yapıştırabilirsiniz.
        // Örnek: const myFirebaseConfig = { apiKey: "AIza...", authDomain: "proje.firebaseapp.com", ... };
        const myFirebaseConfig = null; 
        // ===========================================

        window.initFirebase = async () => {
            try {
                // Herhangi bir platform bağlantısı olmaksızın sadece sizin girdiğiniz config dosyasını arar
                const firebaseConfig = myFirebaseConfig;
                if (!firebaseConfig) {
                    console.info("Bulut (Firebase) bağlantısı kapalı. Uygulama tarayıcı hafızasında (Local Storage) çalışacak.");
                    return null;
                }
                
                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                const db = getFirestore(app);
                
                // Özel token'lar temizlendi, standart anonim giriş
                await signInAnonymously(auth);
                
                return { auth, db };
            } catch (e) {
                console.error("Firebase başlatılamadı:", e);
                return null;
            }
        };
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, memo, useRef } = React;

        const generateAIContent = async (prompt, systemInstruction = "", retries = 3) => {
            // === GITHUB İÇİN GÜVENLİ YAPAY ZEKA ALANI ===
            // Yapay zeka özelliklerini açmak için Google AI Studio'dan (aistudio.google.com) 
            // ücretsiz bir API anahtarı alıp buraya tırnakların içine yazabilirsiniz.
            const apiKey = ""; 
            
            if (!apiKey) {
                return "Yapay zeka özellikleri şu an kapalı. (Geliştirici Notu: Koda kendi Gemini API anahtarınızı eklemeniz gerekmektedir.)";
            }
            // ============================================

            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ role: "user", parts: [{ text: prompt }] }],
            };
            if (systemInstruction) {
                payload.systemInstruction = { parts: [{ text: systemInstruction }] };
            }
            
            for (let i = 0; i < retries; i++) {
                try {
                    const res = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    const data = await res.json();
                    if (data.candidates && data.candidates.length > 0) {
                        return data.candidates[0].content.parts[0].text;
                    }
                    // Handle rate limits with exponential backoff
                    if (res.status === 429) {
                        await new Promise(resolve => setTimeout(resolve, Math.pow(2, i) * 1000));
                        continue;
                    }
                    return "Yapay zeka şu an okeye dördüncü arıyor, lütfen tekrar deneyin.";
                } catch (e) {
                    if (i === retries - 1) return "Yapay zekaya bağlantı kurulamadı.";
                    await new Promise(resolve => setTimeout(resolve, Math.pow(2, i) * 1000));
                }
            }
        };

        const generateId = () => Math.random().toString(36).substr(2, 9);
        const shuffleArray = (array) => {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        };

        const GAME_TYPES = [
            { id: 'normal', name: 'Normal Okey' },
            { id: '101', name: '101 Okey' }
        ];

        const Card = ({ children, className = "", onClick }) => (
            <div onClick={onClick} className={`bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden ${className}`}>
                {children}
            </div>
        );

        const Button = ({ children, onClick, variant = 'primary', className = "", disabled = false, type="button", size="md", title }) => {
            const sizes = { sm: "px-3 py-1.5 text-sm", md: "px-4 py-2.5", lg: "px-6 py-3 text-lg" };
            const variants = {
                primary: "bg-okey-600 hover:bg-okey-700 text-white shadow-sm",
                secondary: "bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-100",
                danger: "bg-red-50 dark:bg-red-900/30 hover:bg-red-100 dark:hover:bg-red-900/50 text-red-600 dark:text-red-400 border border-red-100 dark:border-red-800",
                outline: "border-2 border-okey-600 text-okey-600 dark:border-okey-500 dark:text-okey-400 hover:bg-okey-50 dark:hover:bg-okey-900/30",
                ghost: "hover:bg-slate-100 dark:hover:bg-slate-700/50 text-slate-600 dark:text-slate-300"
            };
            const baseStyle = "rounded-xl font-medium transition-all duration-200 active:scale-95 disabled:opacity-50 disabled:pointer-events-none flex items-center justify-center gap-2";
            return (
                <button type={type} onClick={onClick} disabled={disabled} title={title} className={`${baseStyle} ${variants[variant]} ${sizes[size]} ${className}`}>
                    {children}
                </button>
            );
        };

        const Input = ({ value, onChange, placeholder, type = "text", className = "", onKeyDown, autoFocus }) => (
            <input
                type={type} value={value} onChange={onChange} placeholder={placeholder} onKeyDown={onKeyDown} autoFocus={autoFocus}
                className={`w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-okey-500/50 focus:border-okey-500 text-slate-800 dark:text-slate-100 transition-all ${className}`}
            />
        );

        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-slate-900/50 z-50 flex items-center justify-center p-4 backdrop-blur-sm fade-in">
                    <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-xl w-full max-w-md overflow-hidden flex flex-col max-h-[90vh] border border-slate-200 dark:border-slate-700">
                        <div className="p-4 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center bg-slate-50/50 dark:bg-slate-800">
                            <h3 className="font-semibold text-lg text-slate-800 dark:text-slate-100">{title}</h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                            </button>
                        </div>
                        <div className="p-5 overflow-y-auto">{children}</div>
                    </div>
                </div>
            );
        };

        const ConfirmModal = ({ isOpen, onClose, onConfirm, title, message, confirmText = "Onayla", variant="primary" }) => (
            <Modal isOpen={isOpen} onClose={onClose} title={title}>
                <p className="text-slate-600 dark:text-slate-300 mb-6">{message}</p>
                <div className="flex gap-3 justify-end">
                    <Button variant="ghost" onClick={onClose}>İptal</Button>
                    <Button variant={variant} onClick={() => { onConfirm(); onClose(); }}>{confirmText}</Button>
                </div>
            </Modal>
        );

        const YazbozInput = memo(({ value, onChange }) => {
            const [localVal, setLocalVal] = useState(value !== undefined ? value : '');
            
            useEffect(() => { setLocalVal(value !== undefined ? value : ''); }, [value]);

            const handleBlur = () => {
                if (localVal === '-' || localVal === '') onChange('');
                else {
                    const parsed = parseInt(localVal, 10);
                    if (!isNaN(parsed)) onChange(parsed);
                    else onChange('');
                }
            };

            const handleChange = (e) => {
                const val = e.target.value;
                // Sadece boş bırakmaya, tek başına eksi (-) işaretine veya eksi ile başlayabilen sayılara izin ver
                if (val === '' || val === '-' || /^-?\d+$/.test(val)) {
                    setLocalVal(val);
                }
            };

            return (
                <input 
                    type="text" inputMode="numeric" value={localVal}
                    onChange={handleChange} onBlur={handleBlur} onKeyDown={e => e.key === 'Enter' && e.target.blur()}
                    className="w-full text-center py-4 bg-transparent outline-none focus:bg-okey-50 dark:focus:bg-okey-900/30 focus:ring-inset focus:ring-2 focus:ring-okey-400 font-bold text-slate-800 dark:text-slate-100 transition-all text-base md:text-lg rounded-none"
                />
            );
        });

        const YazbozNoteInput = memo(({ value, onChange }) => {
            const [localVal, setLocalVal] = useState(value || '');
            useEffect(() => { setLocalVal(value || ''); }, [value]);
            return (
                <input 
                    type="text" value={localVal}
                    onChange={e => setLocalVal(e.target.value)} onBlur={() => onChange(localVal)} onKeyDown={e => e.key === 'Enter' && e.target.blur()}
                    placeholder="Not..."
                    className="w-full text-center py-4 bg-transparent outline-none focus:bg-slate-50 dark:focus:bg-slate-800 focus:ring-inset focus:ring-2 focus:ring-slate-300 text-slate-500 text-xs italic transition-all rounded-none"
                />
            );
        });

        const Navbar = ({ navigate, isDark, toggleTheme, profile, useCloud }) => (
            <nav className="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-40 shadow-sm transition-colors">
                <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
                    <div className="flex items-center gap-2 cursor-pointer transition-transform hover:scale-105" onClick={() => navigate('home')}>
                        <div className="bg-okey-600 text-white p-2 rounded-lg shadow-md flex items-center justify-center">
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                        </div>
                        <span className="font-bold text-xl text-slate-800 dark:text-slate-100 tracking-tight flex items-center gap-2">
                            Okey Masası
                            {useCloud && <span title="Bulut Senkronizasyonu Aktif"><svg className="w-4 h-4 text-sky-500" fill="currentColor" viewBox="0 0 20 20"><path d="M5.5 16a3.5 3.5 0 01-.369-6.98 4 4 0 117.753-1.977A4.5 4.5 0 1113.5 16h-8z"></path></svg></span>}
                        </span>
                    </div>
                    <div className="flex gap-2 items-center">
                        {profile?.name && (
                            <div onClick={() => navigate('stats')} className="hidden sm:flex items-center gap-2 bg-slate-100 dark:bg-slate-700/50 hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors px-3 py-1.5 rounded-full text-sm font-semibold text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-600 cursor-pointer">
                                <svg className="w-4 h-4 text-okey-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                                {profile.name}
                            </div>
                        )}
                        <button onClick={toggleTheme} className="p-2 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100 dark:hover:text-slate-200 dark:hover:bg-slate-700 transition-colors">
                            {isDark ? <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg> : <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>}
                        </button>
                    </div>
                </div>
            </nav>
        );

        const ProfileSetup = ({ onSave }) => {
            const [name, setName] = useState('');
            return (
                <div className="min-h-[80vh] flex items-center justify-center bg-slate-50 dark:bg-slate-900 p-4 fade-in">
                    <Card className="max-w-md w-full p-8 text-center shadow-lg border-2 border-okey-100 dark:border-okey-900/50">
                        <div className="w-20 h-20 bg-okey-100 dark:bg-okey-900/50 text-okey-600 dark:text-okey-400 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner">
                           <svg className="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        </div>
                        <h2 className="text-2xl font-bold text-slate-800 dark:text-white mb-2">Okey Masasına Hoş Geldiniz!</h2>
                        <p className="text-slate-500 dark:text-slate-400 mb-6 text-sm leading-relaxed">
                            Kişisel istatistiklerinizi, kazanma oranınızı ve liderlik tablosundaki yerinizi takip edebilmek için bir oyuncu adı belirleyin.
                            <br/><br/>
                            <strong className="text-okey-600 dark:text-okey-400">Önemli:</strong> Oyun kurarken yazılan isimlerle eşleşme sağlanır. Arkadaşlarınızla benzer isimler girmemeye (Örn: Ahmet K.) özen gösterin.
                        </p>
                        <Input value={name} onChange={e => setName(e.target.value)} placeholder="Oyuncu Adınız veya Lakabınız" className="mb-4 text-center font-bold text-lg" autoFocus onKeyDown={e => e.key === 'Enter' && name.trim() && onSave(name.trim())}/>
                        <Button className="w-full shadow-md py-3 text-lg" disabled={!name.trim()} onClick={() => onSave(name.trim())}>Kaydet ve Başla</Button>
                    </Card>
                </div>
            )
        };

        const HomeView = ({ navigate, games }) => (
            <div className="max-w-6xl mx-auto px-4 py-12 fade-in">
                <div className="text-center mb-12">
                    <h1 className="text-4xl md:text-5xl font-extrabold text-slate-800 dark:text-white mb-4 tracking-tight">Okey Gecenizi Düzenleyin</h1>
                    <p className="text-lg text-slate-600 dark:text-slate-400 max-w-2xl mx-auto leading-relaxed">Rastgele eşleştirme yapın, puanları güvenle buluta kaydedin ve liderlik tablosunda yerinizi alın.</p>
                </div>
                
                <div className="grid md:grid-cols-3 gap-6 max-w-5xl mx-auto">
                    <Card className="p-8 flex flex-col items-center text-center hover:shadow-lg hover:-translate-y-1 transition-all duration-300 border-2 border-transparent hover:border-okey-200 dark:hover:border-okey-700 cursor-pointer" onClick={() => { try { window.scrollTo(0,0); } catch(e){} navigate('setup'); }}>
                        <div className="w-16 h-16 bg-okey-100 dark:bg-okey-900/50 text-okey-600 dark:text-okey-400 rounded-full flex items-center justify-center mb-5 shadow-inner"><svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"></path></svg></div>
                        <h2 className="text-xl font-bold text-slate-800 dark:text-slate-100 mb-3">Yeni Oyun Kur</h2>
                        <p className="text-slate-500 dark:text-slate-400 mb-8 text-sm leading-relaxed">Oyuncu isimlerini girin, masaları rastgele oluşturun ve hemen oynamaya başlayın.</p>
                        <Button className="w-full mt-auto text-lg py-3">Hemen Başla</Button>
                    </Card>
                    
                    <Card className="p-8 flex flex-col items-center text-center hover:shadow-lg hover:-translate-y-1 transition-all duration-300 border-2 border-transparent hover:border-blue-200 dark:hover:border-blue-700 cursor-pointer" onClick={() => { try { window.scrollTo(0,0); } catch(e){} navigate('stats'); }}>
                        <div className="w-16 h-16 bg-blue-100 dark:bg-blue-900/50 text-blue-600 dark:text-blue-400 rounded-full flex items-center justify-center mb-5 shadow-inner"><svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg></div>
                        <h2 className="text-xl font-bold text-slate-800 dark:text-slate-100 mb-3">Liderlik & İstatistikler</h2>
                        <p className="text-slate-500 dark:text-slate-400 mb-8 text-sm leading-relaxed">Gruptaki en iyi okeycileri, galibiyet oranlarını ve kendi gelişiminizi inceleyin.</p>
                        <Button variant="secondary" className="w-full mt-auto py-3 bg-blue-50 text-blue-700 hover:bg-blue-100 dark:bg-blue-900/30 dark:text-blue-300 dark:hover:bg-blue-900/50">İncele</Button>
                    </Card>

                    <Card className="p-8 flex flex-col items-center text-center hover:shadow-lg hover:-translate-y-1 transition-all duration-300 border-2 border-transparent hover:border-slate-300 dark:hover:border-slate-600 cursor-pointer" onClick={() => { try { window.scrollTo(0,0); } catch(e){} navigate('history'); }}>
                        <div className="w-16 h-16 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 rounded-full flex items-center justify-center mb-5 shadow-inner"><svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg></div>
                        <h2 className="text-xl font-bold text-slate-800 dark:text-slate-100 mb-3">Eski Oyunlarım</h2>
                        <p className="text-slate-500 dark:text-slate-400 mb-8 text-sm leading-relaxed">Önceki oyunların puan durumlarını, kazananlarını ve tüm detaylarını görüntüleyin.</p>
                        <Button variant="secondary" className="w-full mt-auto py-3">Geçmişe Göz At</Button>
                    </Card>
                </div>

                {games.filter(g => g.status === 'active').length > 0 && (
                    <div className="max-w-5xl mx-auto mt-16">
                        <h3 className="font-semibold text-slate-800 dark:text-slate-200 mb-4 flex items-center gap-2 text-lg">
                            <span className="relative flex h-3 w-3"><span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-okey-400 opacity-75"></span><span className="relative inline-flex rounded-full h-3 w-3 bg-okey-500"></span></span>
                            Devam Eden Oyunlar
                        </h3>
                        <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
                            {games.filter(g => g.status === 'active').map(game => (
                                <Card key={game.id} className="p-5 flex justify-between items-center hover:border-okey-300 dark:hover:border-okey-700 transition-colors shadow-sm cursor-pointer" onClick={() => navigate('game', game.id)}>
                                    <div className="truncate pr-4">
                                        <h4 className="font-bold text-slate-800 dark:text-slate-100 truncate">{game.title || 'İsimsiz Oyun'}</h4>
                                        <p className="text-xs text-slate-500 dark:text-slate-400 mt-1.5 flex items-center gap-1">
                                            <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                            {new Date(game.date).toLocaleDateString('tr-TR')} • Masa: {game.tables.length}
                                        </p>
                                    </div>
                                    <Button variant="outline" size="sm" className="bg-white dark:bg-slate-800 shrink-0">Devam Et</Button>
                                </Card>
                            ))}
                        </div>
                    </div>
                )}
            </div>
        );

        const StatsView = ({ navigate, games, profileName }) => {
            const stats = {};
            
            games.filter(g => g.status === 'finished').forEach(game => {
                game.tables.forEach(table => {
                    const totals = {};
                    table.rounds.forEach(r => Object.keys(r.scores).forEach(id => { totals[id] = (totals[id] || 0) + r.scores[id]; }));
                    
                    const entities = [];
                    table.rounds.forEach(r => Object.keys(r.scores).forEach(id => {
                        if (!entities.find(e => e.id === id)) entities.push({id});
                    }));
                    
                    if (entities.length === 0 || table.rounds.length === 0) return;

                    const results = entities.map(e => {
                        let name = "Bilinmeyen";
                        if (table.mode === 'tekli') {
                            const p = table.players?.find(x => x.id === e.id) || table.substitutes?.find(x => x.id === e.id);
                            if (p) name = p.name;
                            return { id: e.id, names: [name], score: totals[e.id] || 0 };
                        } else {
                            const t = table.teams?.find(x => x.id === e.id);
                            if (t) return { id: e.id, names: t.players.map(p => p.name), score: totals[e.id] || 0 };
                            // Takımda olmayan yancı tek başına id bıraktıysa (nadir)
                            const s = table.substitutes?.find(x => x.id === e.id);
                            if (s) return { id: e.id, names: [s.name], score: totals[e.id] || 0 };
                            return { id: e.id, names: [name], score: totals[e.id] || 0 };
                        }
                    });
                    
                    results.sort((a,b) => game.winCondition === 'highest' ? b.score - a.score : a.score - b.score);
                    const winnerScore = results[0].score;
                    
                    results.forEach(res => {
                        const isWinner = res.score === winnerScore;
                        res.names.forEach(n => {
                            if (!stats[n]) stats[n] = { name: n, played: 0, won: 0, totalScore: 0 };
                            stats[n].played++;
                            if (isWinner) stats[n].won++;
                            stats[n].totalScore += res.score;
                        });
                    });
                });
            });
            
            const leaderboard = Object.values(stats).sort((a,b) => {
                if (b.won !== a.won) return b.won - a.won;
                return b.played - a.played;
            });
            
            const myStats = stats[profileName] || { name: profileName, played: 0, won: 0, totalScore: 0 };

            return (
                <div className="max-w-5xl mx-auto px-4 py-8 fade-in">
                    <div className="flex items-center gap-4 mb-8 border-b border-slate-200 dark:border-slate-700 pb-4">
                        <button onClick={() => navigate('home')} className="text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 bg-white dark:bg-slate-800 p-2.5 rounded-full shadow-sm border border-slate-200 dark:border-slate-700 transition-colors">
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                        </button>
                        <div>
                            <h1 className="text-2xl font-bold text-slate-800 dark:text-slate-100">İstatistikler & Liderlik</h1>
                            <p className="text-sm text-slate-500 dark:text-slate-400">Buluta kayıtlı tüm bitmiş oyunlardan hesaplanan veriler.</p>
                        </div>
                    </div>
                    
                    <div className="grid md:grid-cols-4 gap-4 mb-10">
                        <Card className="p-6 bg-gradient-to-br from-okey-500 to-okey-700 border-0 text-white shadow-lg shadow-okey-600/20">
                            <h3 className="text-okey-100 font-medium mb-1 text-sm">Oynadığım Oyun</h3>
                            <div className="text-4xl font-black">{myStats.played}</div>
                        </Card>
                        <Card className="p-6 bg-gradient-to-br from-blue-500 to-blue-700 border-0 text-white shadow-lg shadow-blue-600/20">
                            <h3 className="text-blue-100 font-medium mb-1 text-sm">Kazanılan</h3>
                            <div className="text-4xl font-black">{myStats.won}</div>
                        </Card>
                        <Card className="p-6 bg-gradient-to-br from-purple-500 to-purple-700 border-0 text-white shadow-lg shadow-purple-600/20">
                            <h3 className="text-purple-100 font-medium mb-1 text-sm">Kazanma Oranı</h3>
                            <div className="text-4xl font-black">{myStats.played > 0 ? Math.round((myStats.won / myStats.played) * 100) : 0}%</div>
                        </Card>
                        <Card className="p-6 bg-gradient-to-br from-yellow-400 to-yellow-600 border-0 text-white shadow-lg shadow-yellow-500/20">
                            <h3 className="text-yellow-100 font-medium mb-1 text-sm">Kazandırdığım Toplam Puan</h3>
                            <div className="text-4xl font-black">{myStats.totalScore}</div>
                        </Card>
                    </div>
                    
                    <h2 className="text-xl font-bold text-slate-800 dark:text-slate-100 mb-4 flex items-center gap-2">
                        <svg className="w-6 h-6 text-yellow-500" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M10 2a.75.75 0 01.75.75v1.282l2.22 1.48a.75.75 0 01-.832 1.248L10 5.286l-2.138 1.474a.75.75 0 01-.832-1.248l2.22-1.48V2.75A.75.75 0 0110 2zm4.125 5.86a.75.75 0 011.002.404l1.455 3.639a.75.75 0 01-1.393.557l-.316-.79h-9.746l-.316.79a.75.75 0 01-1.393-.557l1.455-3.639a.75.75 0 011.002-.404h8.25zM7.5 13h5a.75.75 0 01.75.75v3.5a.75.75 0 01-.75.75h-5a.75.75 0 01-.75-.75v-3.5a.75.75 0 01.75-.75z" clipRule="evenodd"></path></svg>
                        Global Liderlik Tablosu
                    </h2>
                    <Card className="overflow-x-auto">
                        <table className="w-full text-left border-collapse min-w-[500px]">
                            <thead className="bg-slate-50 dark:bg-slate-900/50 border-b border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400 font-semibold text-sm">
                                <tr>
                                    <th className="p-4 w-16 text-center">Sıra</th>
                                    <th className="p-4">Oyuncu</th>
                                    <th className="p-4 text-center">Oyun</th>
                                    <th className="p-4 text-center">Galibiyet</th>
                                    <th className="p-4 text-center">Oran</th>
                                    <th className="p-4 text-right">Toplam Puan</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                                {leaderboard.map((user, idx) => (
                                    <tr key={user.name} className={`hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors ${user.name === profileName ? 'bg-okey-50 dark:bg-okey-900/20' : ''}`}>
                                        <td className="p-4 text-center text-xl">
                                            {idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : <span className="font-bold text-slate-400 text-base">{idx+1}</span>}
                                        </td>
                                        <td className="p-4 font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2">
                                            {user.name} {user.name === profileName && <span className="text-[10px] bg-okey-600 text-white px-2 py-0.5 rounded-full font-bold uppercase tracking-wider">Sen</span>}
                                        </td>
                                        <td className="p-4 text-center font-medium text-slate-600 dark:text-slate-400">{user.played}</td>
                                        <td className="p-4 text-center font-bold text-slate-700 dark:text-slate-300">{user.won}</td>
                                        <td className="p-4 text-center font-medium text-slate-600 dark:text-slate-400">
                                            <div className="w-full bg-slate-200 dark:bg-slate-700 rounded-full h-2.5 mb-1 max-w-[60px] mx-auto overflow-hidden">
                                              <div className="bg-okey-500 h-2.5 rounded-full" style={{ width: `${Math.round((user.won / user.played)*100)}%` }}></div>
                                            </div>
                                            <span className="text-xs">{Math.round((user.won / user.played)*100)}%</span>
                                        </td>
                                        <td className="p-4 text-right font-black text-slate-700 dark:text-slate-300">{user.totalScore}</td>
                                    </tr>
                                ))}
                                {leaderboard.length === 0 && (
                                    <tr><td colSpan="6" className="p-8 text-center text-slate-500 dark:text-slate-400 font-medium">Henüz tamamlanmış bir oyun bulunmuyor.</td></tr>
                                )}
                            </tbody>
                        </table>
                    </Card>
                </div>
            )
        };

        const SetupView = ({ navigate, createGame, profileName }) => {
            const [players, setPlayers] = useState([profileName || '', '', '', '']);
            const [gameType, setGameType] = useState('normal');
            const [folding, setFolding] = useState('katlamasiz');
            const [mode, setMode] = useState('tekli');
            const [winCondition, setWinCondition] = useState('lowest');
            const [title, setTitle] = useState('');
            const [error, setError] = useState('');

            useEffect(() => {
                if (gameType === '101') setWinCondition('highest');
                else setWinCondition('lowest');
            }, [gameType]);

            const addPlayer = () => { setPlayers([...players, '']); setError(''); };
            const removePlayer = (index) => { if(players.length>4){ const newP = [...players]; newP.splice(index, 1); setPlayers(newP); setError(''); } };
            const updatePlayer = (index, value) => { const newP = [...players]; newP[index] = value; setPlayers(newP); setError(''); };

            const startAssignment = () => {
                const validPlayers = players.map(p => p.trim()).filter(p => p !== '');
                if (validPlayers.length < 4) { setError('Oynamak için en az 4 oyuncu ismi girmelisiniz.'); return; }
                if (new Set(validPlayers).size !== validPlayers.length) { setError('Oyuncu isimleri birbirinden farklı olmalıdır. (Aynı ismi iki kez yazmayın)'); return; }

                const shuffled = shuffleArray([...validPlayers]);
                const newGame = {
                    id: generateId(),
                    title: title.trim() || `${new Date().toLocaleDateString('tr-TR')} Okey Gecesi`,
                    date: new Date().toISOString(),
                    type: gameType, folding: folding, mode: mode, winCondition: winCondition,
                    status: 'active', tables: []
                };

                const numTables = Math.floor(validPlayers.length / 4);
                const activePlayersList = shuffled.slice(0, numTables * 4);
                const substitutesList = shuffled.slice(numTables * 4).map(name => ({ id: generateId(), name }));

                for (let i = 0; i < numTables; i++) {
                    const tableActive = activePlayersList.slice(i * 4, (i + 1) * 4);
                    const tableSubs = substitutesList.filter((_, idx) => idx % numTables === i);
                    const table = { id: generateId(), number: i + 1, substitutes: tableSubs, rounds: [], mode: mode, photos: [] };
                    
                    if (mode === 'tekli') { table.players = tableActive.map(name => ({ id: generateId(), name })); } 
                    else {
                        table.teams = [
                            { id: generateId(), name: 'Takım A', players: [{ id: generateId(), name: tableActive[0] }, { id: generateId(), name: tableActive[1] }] },
                            { id: generateId(), name: 'Takım B', players: [{ id: generateId(), name: tableActive[2] }, { id: generateId(), name: tableActive[3] }] }
                        ];
                    }
                    newGame.tables.push(table);
                }
                createGame(newGame);
            };

            return (
                <div className="max-w-4xl mx-auto px-4 py-8 fade-in">
                    <div className="flex items-center gap-4 mb-8 border-b border-slate-200 dark:border-slate-700 pb-4">
                        <button onClick={() => navigate('home')} className="text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 bg-white dark:bg-slate-800 p-2.5 rounded-full shadow-sm border border-slate-200 dark:border-slate-700 transition-colors">
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                        </button>
                        <div>
                            <h1 className="text-2xl font-bold text-slate-800 dark:text-slate-100">Yeni Oyun Kur</h1>
                            <p className="text-sm text-slate-500 dark:text-slate-400">Oyuncuları ve oyun kurallarını belirleyin.</p>
                        </div>
                    </div>

                    <div className="grid md:grid-cols-5 gap-6">
                        <div className="md:col-span-3 space-y-6">
                            <Card className="p-6">
                                <div className="flex justify-between items-center mb-6">
                                    <h2 className="text-lg font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2">
                                        <svg className="w-5 h-5 text-okey-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                                        Oyuncular
                                    </h2>
                                    <span className="text-xs font-bold bg-okey-100 dark:bg-okey-900/50 text-okey-700 dark:text-okey-400 px-3 py-1 rounded-full">{players.length} Oyuncu</span>
                                </div>
                                <div className="space-y-3">
                                    {players.map((p, i) => (
                                        <div key={i} className="flex gap-2 relative fade-in">
                                            <div className="absolute left-3 top-3 text-slate-400 dark:text-slate-500 font-bold w-6 text-center text-sm">{i+1}</div>
                                            <Input className="pl-11" value={p} onChange={e => updatePlayer(i, e.target.value)} placeholder={`Oyuncu ${i+1}`} />
                                            {players.length > 4 && (
                                                <Button variant="danger" className="px-3 border-transparent" onClick={() => removePlayer(i)} title="Oyuncuyu Sil">
                                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                                </Button>
                                            )}
                                        </div>
                                    ))}
                                </div>
                                <div className="mt-4">
                                    <Button variant="outline" className="w-full border-dashed border-2 py-3 bg-slate-50/50 dark:bg-slate-800/50" onClick={addPlayer} disabled={players.length >= 20}>
                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"></path></svg>
                                        Yeni Oyuncu Ekle {players.length >= 20 && `(Maks 20)`}
                                    </Button>
                                </div>
                                
                                {players.filter(p => p.trim() !== '').length > 4 && (
                                    <div className="mt-5 bg-blue-50/80 dark:bg-blue-900/20 border border-blue-100 dark:border-blue-800/50 text-blue-800 dark:text-blue-300 p-4 rounded-xl text-sm flex gap-3 fade-in shadow-sm">
                                        <svg className="w-5 h-5 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                        <p><strong>{players.filter(p => p.trim() !== '').length} oyuncu:</strong> {Math.floor(players.filter(p => p.trim() !== '').length / 4)} masa oluşturulacak ve {players.filter(p => p.trim() !== '').length % 4} kişi yancı olarak atanacak.</p>
                                    </div>
                                )}
                            </Card>
                        </div>

                        <div className="md:col-span-2 space-y-6">
                            <Card className="p-6">
                                <h2 className="text-lg font-bold text-slate-800 dark:text-slate-100 mb-5 border-b border-slate-100 dark:border-slate-700 pb-3 flex items-center gap-2">
                                    <svg className="w-5 h-5 text-slate-500 dark:text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                    Oyun Ayarları
                                </h2>
                                
                                <div className="space-y-5">
                                    <div>
                                        <label className="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Oyun Adı (Opsiyonel)</label>
                                        <Input value={title} onChange={e => setTitle(e.target.value)} placeholder="Örn: Hafta Sonu Turnuvası" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Oyun Türü</label>
                                        <div className="flex bg-slate-100 dark:bg-slate-700/50 p-1.5 rounded-xl border border-slate-200 dark:border-slate-700/50">
                                            {GAME_TYPES.map(t => (
                                                <button key={t.id} onClick={() => setGameType(t.id)} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all ${gameType === t.id ? 'bg-white dark:bg-slate-600 shadow-sm text-slate-800 dark:text-white' : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'}`}>{t.name}</button>
                                            ))}
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Katlama Durumu</label>
                                        <div className="flex bg-slate-100 dark:bg-slate-700/50 p-1.5 rounded-xl border border-slate-200 dark:border-slate-700/50">
                                            <button onClick={() => setFolding('katlamasiz')} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all ${folding === 'katlamasiz' ? 'bg-white dark:bg-slate-600 shadow-sm text-slate-800 dark:text-white' : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'}`}>Katlamasız</button>
                                            <button onClick={() => setFolding('katlamali')} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all ${folding === 'katlamali' ? 'bg-white dark:bg-slate-600 shadow-sm text-slate-800 dark:text-white' : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'}`}>Katlamalı</button>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Oynanış Şekli</label>
                                        <div className="flex bg-slate-100 dark:bg-slate-700/50 p-1.5 rounded-xl border border-slate-200 dark:border-slate-700/50">
                                            <button onClick={() => setMode('tekli')} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all ${mode === 'tekli' ? 'bg-white dark:bg-slate-600 shadow-sm text-slate-800 dark:text-white' : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'}`}>Bireysel</button>
                                            <button onClick={() => setMode('takimli')} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all ${mode === 'takimli' ? 'bg-white dark:bg-slate-600 shadow-sm text-slate-800 dark:text-white' : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'}`}>Eşli</button>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Kazanma Kuralı</label>
                                        <div className="flex flex-col gap-2">
                                            <label className={`flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition-colors ${winCondition === 'lowest' ? 'bg-okey-50 border-okey-200 dark:bg-okey-900/30 dark:border-okey-700' : 'bg-white border-slate-200 dark:bg-slate-800 dark:border-slate-700'}`}>
                                                <input type="radio" checked={winCondition === 'lowest'} onChange={() => setWinCondition('lowest')} className="w-4 h-4 text-okey-600" />
                                                <div><div className="font-semibold text-sm text-slate-800 dark:text-slate-100">En Az Puan Kazandırır</div><div className="text-xs text-slate-500 dark:text-slate-400">Ceza sistemi (Eksiye düşme)</div></div>
                                            </label>
                                            <label className={`flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition-colors ${winCondition === 'highest' ? 'bg-okey-50 border-okey-200 dark:bg-okey-900/30 dark:border-okey-700' : 'bg-white border-slate-200 dark:bg-slate-800 dark:border-slate-700'}`}>
                                                <input type="radio" checked={winCondition === 'highest'} onChange={() => setWinCondition('highest')} className="w-4 h-4 text-okey-600" />
                                                <div><div className="font-semibold text-sm text-slate-800 dark:text-slate-100">En Çok Puan Kazandırır</div><div className="text-xs text-slate-500 dark:text-slate-400">101 Okey veya artı puan</div></div>
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </Card>

                            {error && (
                                <div className="p-4 bg-red-50 text-red-700 rounded-xl text-sm border border-red-100 flex items-start gap-3 shadow-sm fade-in">
                                    <svg className="w-5 h-5 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                                    <span className="font-medium">{error}</span>
                                </div>
                            )}

                            <Button className="w-full py-4 text-lg shadow-md shadow-okey-600/20" onClick={startAssignment}>
                                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                Rastgele Eşleştir & Başla
                            </Button>
                        </div>
                    </div>
                </div>
            );
        };

        const ActiveGameView = ({ navigate, currentGame, saveGame, showToast }) => {
            if (!currentGame) return <div className="text-center py-20 text-slate-500">Oyun bulunamadı veya silinmiş.</div>;

            const [selectedTableId, setSelectedTableId] = useState(() => currentGame.tables[0]?.id);
            const [viewMode, setViewMode] = useState('masa');
            const [showEndGameModal, setShowEndGameModal] = useState(false);
            const [substitutingPlayer, setSubstitutingPlayer] = useState(null); 
            const [substitutingTableId, setSubstitutingTableId] = useState(null);
            const [swappingPlayerId, setSwappingPlayerId] = useState(null);
            const [editingTeamId, setEditingTeamId] = useState(null);
            const [editTeamName, setEditTeamName] = useState("");
            const [generatingAiNameFor, setGeneratingAiNameFor] = useState(null);

            const [activeTour, setActiveTour] = useState(1);
            const [extendedRows, setExtendedRows] = useState({});

            const activeTableId = currentGame.tables.some(t => t.id === selectedTableId) ? selectedTableId : currentGame.tables[0].id;
            const activeTable = currentGame.tables.find(t => t.id === activeTableId);
            if (!activeTable) return <div>Masa verisi hatalı.</div>;

            const reshuffleTable = (tableId) => {
                const table = currentGame.tables.find(t => t.id === tableId);
                if (table.rounds.length > 0) return;
                let allPlayers = table.mode === 'tekli' ? [...table.players, ...table.substitutes] : [...table.teams[0].players, ...table.teams[1].players, ...table.substitutes];
                const shuffled = shuffleArray(allPlayers);
                const newTable = JSON.parse(JSON.stringify(table));
                
                if (table.mode === 'tekli') { newTable.players = shuffled.slice(0, 4); newTable.substitutes = shuffled.slice(4); } 
                else { newTable.teams[0].players = [shuffled[0], shuffled[1]]; newTable.teams[1].players = [shuffled[2], shuffled[3]]; newTable.substitutes = shuffled.slice(4); }
                saveGame({ ...currentGame, tables: currentGame.tables.map(t => t.id === tableId ? newTable : t) });
            };

            const completeSubstitution = (activeTargetId) => {
                if (!substitutingPlayer || !substitutingTableId) return;
                const newTable = JSON.parse(JSON.stringify(currentGame.tables.find(t => t.id === substitutingTableId)));
                let replacedPlayer = null;

                if (newTable.mode === 'tekli') {
                    const idx = newTable.players.findIndex(p => p.id === activeTargetId);
                    if (idx !== -1) { replacedPlayer = newTable.players[idx]; newTable.players[idx] = substitutingPlayer; }
                } else {
                    for (let team of newTable.teams) {
                        const idx = team.players.findIndex(p => p.id === activeTargetId);
                        if (idx !== -1) { replacedPlayer = team.players[idx]; team.players[idx] = substitutingPlayer; break; }
                    }
                }

                if (replacedPlayer) {
                    newTable.substitutes = newTable.substitutes.filter(s => s.id !== substitutingPlayer.id);
                    newTable.substitutes.push(replacedPlayer);
                    saveGame({ ...currentGame, tables: currentGame.tables.map(t => t.id === substitutingTableId ? newTable : t) });
                }
                setSubstitutingPlayer(null); setSubstitutingTableId(null);
            };

            const completeSwap = (targetId) => {
                if (!swappingPlayerId || swappingPlayerId === targetId) return;
                const newTable = JSON.parse(JSON.stringify(activeTable));
                
                if (newTable.mode === 'tekli') {
                    const sIdx = newTable.players.findIndex(p => p.id === swappingPlayerId);
                    const tIdx = newTable.players.findIndex(p => p.id === targetId);
                    if (sIdx !== -1 && tIdx !== -1) { const temp = newTable.players[sIdx]; newTable.players[sIdx] = newTable.players[tIdx]; newTable.players[tIdx] = temp; }
                } else {
                    let sourceRef = null, targetRef = null;
                    for (let t of newTable.teams) {
                        const sIdx = t.players.findIndex(p => p.id === swappingPlayerId); if (sIdx !== -1) sourceRef = { team: t, idx: sIdx };
                        const tIdx = t.players.findIndex(p => p.id === targetId); if (tIdx !== -1) targetRef = { team: t, idx: tIdx };
                    }
                    if (sourceRef && targetRef) {
                        const temp = sourceRef.team.players[sourceRef.idx];
                        sourceRef.team.players[sourceRef.idx] = targetRef.team.players[targetRef.idx];
                        targetRef.team.players[targetRef.idx] = temp;
                    }
                }
                saveGame({ ...currentGame, tables: currentGame.tables.map(t => t.id === activeTable.id ? newTable : t) });
                setSwappingPlayerId(null);
            };

            const getEntities = (table) => table.mode === 'tekli' ? table.players : table.teams;
            const getScoreTotals = (table) => {
                const totals = {};
                table.rounds.forEach(r => Object.keys(r.scores).forEach(eid => { totals[eid] = (totals[eid] || 0) + r.scores[eid]; }));
                return totals;
            };

            const shareResults = async () => {
                let text = `🎲 ${currentGame.title}\nTür: ${GAME_TYPES.find(t=>t.id===currentGame.type)?.name} ${currentGame.folding ? `(${currentGame.folding})` : ''}\n\n`;
                const totals = getScoreTotals(activeTable);
                const entities = getEntities(activeTable);
                let sorted = [...entities].sort((a,b) => currentGame.winCondition === 'highest' ? totals[b.id] - totals[a.id] : totals[a.id] - totals[b.id]);
                text += `🏆 ${activeTable.number}. Masa Lider Tablosu:\n`;
                sorted.forEach((e, i) => { text += `${i+1}. ${e.name}: ${totals[e.id] || 0} Puan\n`; });
                text += `\nOkey Masası ile buluta kaydedildi.`;
                if (navigator.share) { try { await navigator.share({ title: 'Okey Masası Sonuçları', text }); } catch (err) {} } 
                else { try { navigator.clipboard.writeText(text); showToast("Sonuçlar panoya kopyalandı!"); } catch (e) {} }
            };

            const saveTeamName = (tableId, teamId) => {
                if (!editTeamName.trim()) { setEditingTeamId(null); return; }
                const newTable = JSON.parse(JSON.stringify(currentGame.tables.find(t => t.id === tableId)));
                const team = newTable.teams.find(t => t.id === teamId);
                if (team) { team.name = editTeamName.trim(); saveGame({ ...currentGame, tables: currentGame.tables.map(t => t.id === tableId ? newTable : t) }); }
                setEditingTeamId(null);
            };

            const generateAiTeamName = async (team) => {
                setGeneratingAiNameFor(team.id);
                const playerNames = team.players.map(p => p.name).join(' ve ');
                const prompt = `Okey oynayan şu iki oyuncu için çok komik, yaratıcı, havalı, kısa ve Türkçe bir takım ismi üret: ${playerNames}. Sadece takım ismini yaz, tırnak işareti, nokta veya açıklama kullanma. Maksimum 3-4 kelime olsun.`;
                const systemPrompt = "Sen çok yaratıcı bir takım ismi bulucusunsun.";
                const aiName = await generateAIContent(prompt, systemPrompt);
                setEditTeamName(aiName.trim().replace(/['"]/g, ''));
                setGeneratingAiNameFor(null);
            };

            const renderYazboz = () => {
                const currentEntities = getEntities(activeTable);
                const allHistoricalIds = new Set();
                activeTable.rounds.forEach(r => Object.keys(r.scores).forEach(id => allHistoricalIds.add(id)));
                currentEntities.forEach(e => allHistoricalIds.add(e.id));
                
                const getName = (id) => {
                    let e = currentEntities.find(x => x.id === id); if (e) return e.name;
                    let s = activeTable.substitutes?.find(x => x.id === id); if (s) return s.name;
                    return "Bilinmeyen";
                };

                const columns = Array.from(allHistoricalIds).map(id => ({ id, name: getName(id) }));
                
                // Geriye dönük uyumluluk: Eski ellerin hepsini 1. Tur olarak varsay
                const normalizedRounds = activeTable.rounds.map(r => ({ ...r, tourIndex: r.tourIndex || 1 }));
                const currentTourRounds = normalizedRounds.filter(r => r.tourIndex === activeTour);
                
                let lastValidIndex = -1;
                currentTourRounds.forEach((r, i) => { if (Object.keys(r.scores).length > 0 || r.note) lastValidIndex = i; });
                const neededRows = lastValidIndex + 1;
                
                const activeTourKey = `${activeTable.id}-${activeTour}`;
                const manualRows = extendedRows[activeTourKey] || 7;
                // Min 7, uzatıldıysa manualRows kadar, maks 10 satır gösterilir.
                const displayCount = Math.min(10, Math.max(7, neededRows, manualRows));
                
                const displayRounds = [];
                for (let i = 0; i < displayCount; i++) {
                    displayRounds.push(currentTourRounds[i] || { id: `virtual-${activeTour}-${i}`, scores: {}, note: '', tourIndex: activeTour });
                }

                // Sadece mevcut turun toplamları
                const currentTourTotals = {};
                currentTourRounds.forEach(r => Object.keys(r.scores).forEach(id => { currentTourTotals[id] = (currentTourTotals[id] || 0) + r.scores[id]; }));
                
                // Genel Oyun Toplamları
                const overallTotals = {};
                normalizedRounds.forEach(r => Object.keys(r.scores).forEach(id => { overallTotals[id] = (overallTotals[id] || 0) + r.scores[id]; }));

                const updateRoundData = (roundIndex, field, value) => {
                    const newTable = JSON.parse(JSON.stringify(activeTable));
                    newTable.rounds.forEach(r => { if (!r.tourIndex) r.tourIndex = 1; });
                    
                    let tRounds = newTable.rounds.filter(r => r.tourIndex === activeTour);
                    while (tRounds.length <= roundIndex) tRounds.push({ id: generateId(), scores: {}, note: '', tourIndex: activeTour });
                    
                    if (field === 'note') tRounds[roundIndex].note = value;
                    else if (field === 'delete') tRounds[roundIndex] = { id: generateId(), scores: {}, note: '', tourIndex: activeTour };
                    else {
                        if (value === '') delete tRounds[roundIndex].scores[field];
                        else tRounds[roundIndex].scores[field] = value;
                    }
                    
                    // Boş kalan elleri veritabanında tutmaya gerek yok temizle
                    while (tRounds.length > 0) {
                        const last = tRounds[tRounds.length - 1];
                        if (Object.keys(last.scores).length === 0 && !last.note) tRounds.pop();
                        else break;
                    }
                    
                    newTable.rounds = [
                        ...newTable.rounds.filter(r => r.tourIndex < activeTour),
                        ...tRounds,
                        ...newTable.rounds.filter(r => r.tourIndex > activeTour)
                    ];
                    saveGame({ ...currentGame, tables: currentGame.tables.map(t => t.id === activeTable.id ? newTable : t) });
                };

                const maxCreatedTour = Math.max(1, ...normalizedRounds.map(r => r.tourIndex));
                const tourTabs = Array.from({length: Math.max(maxCreatedTour, activeTour)}, (_, i) => i + 1);

                return (
                    <div className="space-y-6">
                        {/* Tur Sekmeleri */}
                        <div className="flex overflow-x-auto gap-2 mb-2 hide-scroll p-1">
                            {tourTabs.map(t => (
                                <button 
                                    key={t} onClick={() => setActiveTour(t)}
                                    className={`px-5 py-2.5 rounded-xl font-bold text-sm whitespace-nowrap transition-all ${activeTour === t ? 'bg-okey-600 text-white shadow-md scale-105' : 'bg-slate-100 dark:bg-slate-700/50 text-slate-500 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-600'}`}
                                >
                                    {t}. Tur (Maç)
                                </button>
                            ))}
                        </div>

                        <Card className="overflow-hidden shadow-md border-0 ring-1 ring-slate-200 dark:ring-slate-700 fade-in">
                            <div className="bg-slate-800 dark:bg-slate-900 text-white p-5 flex justify-between items-center">
                                <div>
                                    <h3 className="font-bold text-lg flex items-center gap-2"><svg className="w-6 h-6 text-okey-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg> {activeTour}. Tur Yazbozu</h3>
                                    <p className="text-xs text-slate-400 mt-1">Bu turun puanlarını hücrelere yazın.</p>
                                </div>
                                <span className="text-sm font-bold bg-slate-700 dark:bg-slate-800 px-3 py-1.5 rounded-lg text-slate-200 border border-slate-600">El: {neededRows}</span>
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full min-w-[500px]">
                                    <thead>
                                        <tr>
                                            <th className="px-3 py-3 border-b border-r bg-slate-100 dark:bg-slate-800 text-slate-500 w-12 text-center">El</th>
                                            {columns.map(c => <th key={c.id} className="px-3 py-3 border-b border-r bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-white font-bold text-center">{c.name}</th>)}
                                            <th className="px-3 py-3 border-b border-r bg-slate-100 dark:bg-slate-800 text-slate-500 text-center">Not</th>
                                            <th className="px-3 py-3 border-b bg-slate-100 dark:bg-slate-800 w-10"></th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100 dark:divide-slate-800/50 bg-white dark:bg-slate-800">
                                    {displayRounds.map((r, i) => (
                                        <tr key={r.id} className="group hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors">
                                            <td className="px-3 py-2 border-r font-bold text-slate-400 bg-slate-50 dark:bg-slate-900/50 text-center">{i + 1}</td>
                                            {columns.map(c => (
                                                <td key={c.id} className="p-0 border-r relative">
                                                    <YazbozInput value={r.scores[c.id]} onChange={(val) => updateRoundData(i, c.id, val)} />
                                                </td>
                                            ))}
                                            <td className="p-0 border-r relative">
                                                <YazbozNoteInput value={r.note} onChange={(val) => updateRoundData(i, 'note', val)} />
                                            </td>
                                            <td className="p-0 align-middle">
                                                <button onClick={() => updateRoundData(i, 'delete', null)} className="text-slate-300 hover:text-red-500 p-2 opacity-0 group-hover:opacity-100 transition-all rounded-full hover:bg-red-50" title="Satırı Temizle"><svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                                            </td>
                                        </tr>
                                    ))}
                                    </tbody>
                                    <tfoot className="bg-slate-100 dark:bg-slate-800 border-t-2 border-slate-300 dark:border-slate-600 text-slate-800 dark:text-white">
                                        <tr>
                                            <td className="px-3 py-4 font-bold border-r text-xs text-slate-500 dark:text-slate-400 text-center">Bu Tur</td>
                                            {columns.map(c => <td key={c.id} className="px-3 py-4 font-bold text-lg border-r text-center">{currentTourTotals[c.id] || 0}</td>)}
                                            <td className="px-3 py-4 border-r" colSpan="2"></td>
                                        </tr>
                                        <tr className="bg-okey-50 dark:bg-okey-900/30 border-t-4 border-okey-500">
                                            <td className="px-3 py-5 font-black border-r text-sm text-center">GENEL</td>
                                            {columns.map(c => <td key={c.id} className={`px-3 py-5 font-black text-2xl border-r text-center ${overallTotals[c.id] > 0 ? 'text-okey-600' : overallTotals[c.id] < 0 ? 'text-red-600' : ''}`}>{overallTotals[c.id] || 0}</td>)}
                                            <td className="px-3 py-5" colSpan="2"></td>
                                        </tr>
                                    </tfoot>
                                </table>
                            </div>
                        </Card>

                        {/* Tur Bitimi ve Uzatma Kontrolleri */}
                        {displayCount === neededRows && displayCount >= 7 && (
                            <div className="p-5 bg-okey-50 dark:bg-okey-900/20 border border-okey-200 dark:border-okey-700/50 rounded-2xl flex flex-col sm:flex-row items-center justify-between gap-5 shadow-sm fade-in">
                                <div>
                                    <h4 className="font-black text-lg text-okey-800 dark:text-okey-300 mb-1">{activeTour}. Tur (Maç) Tamamlandı! 🎉</h4>
                                    <p className="text-sm text-okey-600 dark:text-okey-400 font-medium">Bu turdaki eller bitti. Sonuçları kaydedip yeni maça geçebilirsiniz.</p>
                                </div>
                                <div className="flex flex-col sm:flex-row gap-3 w-full sm:w-auto">
                                    {displayCount < 10 && (
                                        <Button variant="outline" onClick={() => {
                                            setExtendedRows(prev => ({...prev, [activeTourKey]: displayCount + 1}));
                                        }}>Eli Uzat (+1)</Button>
                                    )}
                                    <Button variant="primary" onClick={() => {
                                        setActiveTour(activeTour + 1);
                                        window.scrollTo({ top: 0, behavior: 'smooth' });
                                    }}>Sonraki Tura Geç</Button>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            const renderTableEntities = (table) => {
                const isSubbing = substitutingTableId === table.id;
                const isSwapping = swappingPlayerId !== null;
                const entities = getEntities(table);

                return (
                    <div className={`grid gap-5 ${table.mode === 'tekli' ? 'sm:grid-cols-2' : 'grid-cols-1 md:grid-cols-2'}`}>
                        {entities.map((entity, i) => (
                            <div key={entity.id} className={`p-5 rounded-xl border-2 transition-all ${isSubbing ? 'border-dashed border-okey-400 bg-okey-50 dark:bg-okey-900/20' : 'border-slate-100 dark:border-slate-700 bg-white dark:bg-slate-800 shadow-sm'}`}>
                                {table.mode === 'tekli' ? (
                                    <div className="flex justify-between items-center">
                                        <div className="flex items-center gap-4">
                                            <div className="w-12 h-12 rounded-full bg-slate-100 dark:bg-slate-700 flex items-center justify-center font-black text-lg border">{i+1}</div>
                                            <span className="font-bold text-slate-800 dark:text-white text-lg">{entity.name}</span>
                                        </div>
                                        <div className="flex gap-2">
                                            {isSubbing && <Button size="sm" onClick={() => completeSubstitution(entity.id)} className="animate-pulse">Seç ve Değiş</Button>}
                                            {!isSubbing && !isSwapping && <Button variant="ghost" size="sm" onClick={() => setSwappingPlayerId(entity.id)} className="text-slate-400 hover:text-okey-600"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg></Button>}
                                            {isSwapping && swappingPlayerId === entity.id && <Button variant="danger" size="sm" onClick={() => setSwappingPlayerId(null)}>İptal</Button>}
                                            {isSwapping && swappingPlayerId !== entity.id && <Button variant="outline" size="sm" onClick={() => completeSwap(entity.id)} className="animate-pulse">Bununla Değiş</Button>}
                                        </div>
                                    </div>
                                ) : (
                                    <div>
                                        <div className="font-black text-slate-800 dark:text-white text-lg mb-4 border-b pb-3 flex items-center gap-2">
                                            <span className="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-sm">{i+1}</span>
                                            {editingTeamId === entity.id ? (
                                                <div className="flex items-center gap-2 w-full">
                                                    <Input value={editTeamName} onChange={(e) => setEditTeamName(e.target.value)} className="py-1 px-2 text-sm" placeholder="Takım adı..." onKeyDown={(e) => e.key === 'Enter' && saveTeamName(table.id, entity.id)} autoFocus />
                                                    <Button variant="secondary" size="sm" onClick={() => generateAiTeamName(entity)} className="px-2 py-1 relative" disabled={generatingAiNameFor === entity.id} title="Yapay Zeka ile İsim Bul">
                                                        {generatingAiNameFor === entity.id ? (
                                                            <div className="w-4 h-4 border-2 border-slate-400 border-t-okey-500 rounded-full animate-spin"></div>
                                                        ) : (
                                                            <svg className="w-4 h-4 text-purple-500" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2ZM20 2L20.8 4.2L23 5L20.8 5.8L20 8L19.2 5.8L17 5L19.2 4.2L20 2ZM6 4L6.5 5.5L8 6L6.5 6.5L6 8L5.5 6.5L4 6L5.5 5.5L6 4Z"/></svg>
                                                        )}
                                                    </Button>
                                                    <Button size="sm" onClick={() => saveTeamName(table.id, entity.id)} className="px-2 py-1"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg></Button>
                                                </div>
                                            ) : (
                                                <div className="flex items-center gap-2 w-full group">
                                                    <span>{entity.name}</span>
                                                    <button onClick={() => { setEditingTeamId(entity.id); setEditTeamName(entity.name); }} className="opacity-0 group-hover:opacity-100 text-slate-400 hover:text-okey-600"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg></button>
                                                </div>
                                            )}
                                        </div>
                                        <div className="space-y-3">
                                            {entity.players.map(p => (
                                                <div key={p.id} className="flex justify-between items-center p-3 rounded-xl border bg-slate-50 dark:bg-slate-700/50">
                                                    <span className="font-medium text-slate-700 dark:text-slate-200">{p.name}</span>
                                                    <div className="flex gap-2">
