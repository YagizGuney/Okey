                                                        {isSubbing && <Button variant="outline" size="sm" onClick={() => completeSubstitution(p.id)}>Yerine Geç</Button>}
                                                        {!isSubbing && !isSwapping && <Button variant="ghost" size="sm" onClick={() => setSwappingPlayerId(p.id)}><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg></Button>}
                                                        {isSwapping && swappingPlayerId === p.id && <Button variant="danger" size="sm" onClick={() => setSwappingPlayerId(null)}>İptal</Button>}
                                                        {isSwapping && swappingPlayerId !== p.id && <Button variant="outline" size="sm" onClick={() => completeSwap(p.id)} className="animate-pulse">Değiş</Button>}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>
                );
            };

            return (
                <div className="max-w-5xl mx-auto px-4 py-8 pb-24 fade-in">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4 border-b border-slate-200 dark:border-slate-700 pb-6">
                        <div>
                            <h1 className="text-3xl font-extrabold text-slate-800 dark:text-white tracking-tight">{currentGame.title}</h1>
                            <div className="flex flex-wrap gap-2 mt-2">
                                <span className="bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 px-2.5 py-1 rounded-md text-xs font-semibold">{GAME_TYPES.find(t=>t.id===currentGame.type)?.name} {currentGame.folding ? `(${currentGame.folding})` : ''}</span>
                                <span className="bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 px-2.5 py-1 rounded-md text-xs font-semibold">{currentGame.mode === 'tekli' ? 'Bireysel Oyun' : 'Eşli Oyun'}</span>
                            </div>
                        </div>
                        <div className="flex gap-2 w-full md:w-auto">
                            <Button variant="outline" size="md" onClick={shareResults} className="bg-white dark:bg-slate-800 flex-1 md:flex-none">Paylaş</Button>
                            <Button variant="danger" size="md" onClick={() => setShowEndGameModal(true)} className="flex-1 md:flex-none">Oyunu Bitir</Button>
                        </div>
                    </div>

                    {currentGame.tables.length > 1 && (
                        <div className="flex flex-wrap gap-2 mb-6 bg-slate-100 dark:bg-slate-800 p-1.5 rounded-xl w-full md:w-fit shadow-inner">
                            {currentGame.tables.map(t => (
                                <button key={t.id} onClick={() => setSelectedTableId(t.id)} className={`flex-1 min-w-[100px] py-2.5 text-sm font-bold rounded-lg transition-all ${activeTableId === t.id ? 'bg-white dark:bg-slate-700 shadow text-okey-700 dark:text-okey-400' : 'text-slate-500'}`}>{t.number}. Masa</button>
                            ))}
                        </div>
                    )}

                    <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 mb-6 overflow-hidden">
                        <div className="flex border-b border-slate-100 dark:border-slate-700">
                            <button onClick={() => setViewMode('masa')} className={`flex-1 py-4 text-center font-bold text-base transition-colors ${viewMode === 'masa' ? 'border-b-2 border-okey-500 text-okey-700 dark:text-okey-400' : 'text-slate-500'}`}>Masa Düzeni & Yancılar</button>
                            <button onClick={() => setViewMode('skor')} className={`flex-1 py-4 text-center font-bold text-base transition-colors ${viewMode === 'skor' ? 'border-b-2 border-okey-500 text-okey-700 dark:text-okey-400' : 'text-slate-500'}`}>Skor Takibi</button>
                        </div>

                        <div className="p-4 sm:p-6">
                            {viewMode === 'masa' && (
                                <div className="space-y-10 fade-in">
                                    <div className="flex justify-between items-center mb-6">
                                        <h2 className="text-xl font-bold text-slate-800 dark:text-white flex items-center gap-2"><span className="relative flex h-3 w-3"><span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-okey-400 opacity-75"></span><span className="relative inline-flex rounded-full h-3 w-3 bg-okey-500"></span></span>Aktif Masa</h2>
                                        {activeTable.rounds.length === 0 && <Button variant="outline" size="sm" onClick={() => reshuffleTable(activeTable.id)}>Yerleri Karıştır</Button>}
                                    </div>
                                    {renderTableEntities(activeTable)}
                                    
                                    {activeTable.substitutes.length > 0 && (
                                        <div className="pt-8 border-t border-slate-100 dark:border-slate-700">
                                            <h2 className="text-lg font-bold text-slate-800 dark:text-white mb-5 flex items-center gap-2"><svg className="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg> Yancılar</h2>
                                            <div className="flex flex-wrap gap-4">
                                                {activeTable.substitutes.map(sub => (
                                                    <div key={sub.id} className="bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl p-4 flex items-center gap-4">
                                                        <span className="font-bold text-slate-700 dark:text-slate-200">{sub.name}</span>
                                                        <Button variant="outline" size="sm" onClick={() => { setSubstitutingPlayer(sub); setSubstitutingTableId(activeTable.id); }} disabled={substitutingTableId !== null || swappingPlayerId !== null}>Oyuna Gir</Button>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}
                            {viewMode === 'skor' && <div className="fade-in">{renderYazboz()}</div>}
                        </div>
                    </div>
                    <ConfirmModal isOpen={showEndGameModal} onClose={() => setShowEndGameModal(false)} onConfirm={() => { saveGame({...currentGame, status: 'finished'}); navigate('results', currentGame.id); }} title="Oyunu Bitir" message="Oyunu bitirmek istediğinize emin misiniz? Sonuç ekranına yönlendirileceksiniz." variant="primary" confirmText="Bitir" />
                </div>
            );
        };

        const ResultsView = ({ navigate, currentGame }) => {
            if (!currentGame) return null;

            const [aiSummary, setAiSummary] = useState(null);
            const [isGeneratingAi, setIsGeneratingAi] = useState(false);

            const generateAiSummary = async () => {
                setIsGeneratingAi(true);
                let promptText = `Oyun Adı: ${currentGame.title}\nTür: ${currentGame.type}\nKazanma Kuralı: ${currentGame.winCondition === 'highest' ? 'En çok puanı alan kazanır' : 'En az puanı alan/ceza yiyen kazanır'}\n`;
                
                currentGame.tables.forEach(table => {
                    promptText += `\n${table.number}. Masa Sonuçları:\n`;
                    const totals = {};
                    table.rounds.forEach(r => Object.keys(r.scores).forEach(id => { totals[id] = (totals[id] || 0) + r.scores[id]; }));
                    
                    const entities = table.mode === 'tekli' ? table.players : table.teams;
                    const results = entities.map(e => ({ name: e.name, score: totals[e.id] || 0 }));
                    results.sort((a, b) => currentGame.winCondition === 'highest' ? b.score - a.score : a.score - b.score);
                    
                    results.forEach((r, idx) => {
                        promptText += `${idx + 1}. ${r.name}: ${r.score} Puan\n`;
                    });
                });

                const systemInstruction = "Sen esprili, iğneleyici ve heyecanlı bir Türk Okey masası spikerisin. Verilen maç skorlarına ve kazanma kuralına dikkatlice bakarak, birinci olanı abartılı bir dille öven, sonuncu olanlara tatlı tatlı laf sokan (taş çaldı, yancıya çay ısmarlattı, çifte giderken bitti vb.) komik bir maç özeti yaz. Özeti bir paragraf halinde, en fazla 4 cümleyle sınırla. Sadece maç yorumunu yaz.";
                
                const response = await generateAIContent(promptText, systemInstruction);
                setAiSummary(response);
                setIsGeneratingAi(false);
            };

            const renderTableResult = (table) => {
                const totals = {};
                table.rounds.forEach(r => Object.keys(r.scores).forEach(id => { totals[id] = (totals[id] || 0) + r.scores[id]; }));
                
                const allHistoricalIds = new Set();
                table.rounds.forEach(r => Object.keys(r.scores).forEach(id => allHistoricalIds.add(id)));
                
                const getEntity = (id) => {
                    let entities = table.mode === 'tekli' ? table.players : table.teams;
                    let e = entities.find(x => x.id === id) || table.substitutes?.find(x => x.id === id);
                    return e || { id, name: "Bilinmeyen" };
                };

                const results = Array.from(allHistoricalIds).map(id => ({ entity: getEntity(id), score: totals[id] || 0 }));
                results.sort((a, b) => currentGame.winCondition === 'highest' ? b.score - a.score : a.score - b.score);
                
                if (results.length === 0) return <div className="text-slate-500 text-center p-8 border rounded-xl border-dashed">Bu masada oyun oynanmadı.</div>;
                const winners = results.filter(r => r.score === results[0].score);

                return (
                    <Card className="p-8 mt-6 shadow-md border-2 border-okey-100 dark:border-okey-900">
                        <h3 className="text-xl font-bold text-center text-slate-800 dark:text-white mb-8 border-b pb-4">{currentGame.tables.length > 1 ? `${table.number}. Masa Sonuçları` : 'Oyun Sonucu'}</h3>
                        <div className="text-center mb-10">
                            <div className="w-24 h-24 bg-yellow-100 dark:bg-yellow-900/30 rounded-full flex items-center justify-center mx-auto mb-5 border-4 border-yellow-50 dark:border-yellow-900"><svg className="w-12 h-12 text-yellow-500" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M10 2a.75.75 0 01.75.75v1.282l2.22 1.48a.75.75 0 01-.832 1.248L10 5.286l-2.138 1.474a.75.75 0 01-.832-1.248l2.22-1.48V2.75A.75.75 0 0110 2zm4.125 5.86a.75.75 0 011.002.404l1.455 3.639a.75.75 0 01-1.393.557l-.316-.79h-9.746l-.316.79a.75.75 0 01-1.393-.557l1.455-3.639a.75.75 0 011.002-.404h8.25zM7.5 13h5a.75.75 0 01.75.75v3.5a.75.75 0 01-.75.75h-5a.75.75 0 01-.75-.75v-3.5a.75.75 0 01.75-.75z" clipRule="evenodd"></path></svg></div>
                            <h2 className="text-3xl font-black text-slate-800 dark:text-white mb-2">{winners.length>1?'Beraberlik!':`Kazanan: ${winners[0].entity.name}`}</h2>
                            <p className="text-lg text-slate-600 dark:text-slate-400 font-medium">Skor: <strong className="text-slate-800 dark:text-white">{winners[0].score}</strong></p>
                        </div>
                        <div className="space-y-4 max-w-lg mx-auto">
                            {results.map((r, i) => (
                                <div key={r.entity.id} className={`flex justify-between items-center p-5 rounded-2xl border-2 transition-all ${i === 0 ? 'bg-yellow-50 dark:bg-yellow-900/20 border-yellow-200 shadow-sm my-6 scale-105' : 'bg-white dark:bg-slate-800 border-slate-100 dark:border-slate-700'}`}>
                                    <div className="flex items-center gap-4"><span className={`w-10 h-10 rounded-full flex items-center justify-center font-black text-lg ${i===0?'bg-yellow-400 text-yellow-900':'bg-slate-100 dark:bg-slate-700'}`}>{i+1}</span><span className={`font-bold ${i===0?'text-yellow-900 dark:text-yellow-500 text-lg':'text-slate-700 dark:text-slate-200'}`}>{r.entity.name}</span></div>
                                    <span className={`font-black text-xl ${i===0?'text-yellow-900 dark:text-yellow-500':'text-slate-700 dark:text-slate-200'}`}>{r.score}</span>
                                </div>
                            ))}
                        </div>
                    </Card>
                );
            };

            return (
                <div className="max-w-4xl mx-auto px-4 py-12 fade-in">
                    <div className="text-center mb-10">
                        <span className="bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 px-3 py-1.5 rounded-full text-sm font-bold uppercase mb-4 inline-block">Oyun Bitti</span>
                        <h1 className="text-4xl font-black text-slate-800 dark:text-white mb-2">{currentGame.title}</h1>
                    </div>
                    {currentGame.tables.map(table => <div key={table.id}>{renderTableResult(table)}</div>)}
                    
                    <Card className="p-6 mt-8 border-2 border-purple-100 dark:border-purple-900/50 bg-gradient-to-br from-purple-50 to-white dark:from-slate-800 dark:to-slate-900 relative overflow-hidden fade-in">
                        <div className="absolute top-0 right-0 p-4 opacity-10">
                            <svg className="w-24 h-24 text-purple-600" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2ZM20 2L20.8 4.2L23 5L20.8 5.8L20 8L19.2 5.8L17 5L19.2 4.2L20 2Z"/></svg>
                        </div>
                        <div className="relative z-10 flex flex-col items-center text-center">
                            <h3 className="text-xl font-bold text-slate-800 dark:text-white mb-2 flex items-center gap-2">
                                <svg className="w-6 h-6 text-purple-500" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z"/></svg>
                                Yapay Zeka Maç Yorumu
                            </h3>
                            <p className="text-sm text-slate-500 dark:text-slate-400 mb-6">Yapay zeka spikerimiz bu masadaki efsane kapışmayı sizin için yorumlasın.</p>
                            
                            {aiSummary ? (
                                <div className="bg-white/60 dark:bg-slate-800/60 p-5 rounded-xl border border-purple-200 dark:border-purple-800/50 text-slate-700 dark:text-slate-200 font-medium italic shadow-sm w-full text-left leading-relaxed">
                                    "{aiSummary}"
                                </div>
                            ) : (
                                <Button onClick={generateAiSummary} disabled={isGeneratingAi} className="bg-purple-600 hover:bg-purple-700 text-white border-0 shadow-lg shadow-purple-600/30 transition-transform hover:scale-105">
                                    {isGeneratingAi ? (
                                        <><div className="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div> Yorumlanıyor...</>
                                    ) : (
                                        <><svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg> Maç Yorumu İste</>
                                    )}
                                </Button>
                            )}
                        </div>
                    </Card>

                    <div className="flex flex-col sm:flex-row gap-4 mt-10 justify-center">
                        <Button onClick={() => navigate('setup')} size="lg" className="w-full sm:w-auto">Yeni Oyun Başlat</Button>
                        <Button variant="secondary" onClick={() => navigate('history')} size="lg" className="w-full sm:w-auto">Geçmişe Dön</Button>
                    </div>
                </div>
            );
        };

        const HistoryView = ({ navigate, games, deleteGameFn, importGamesFn, showToast }) => {
            const fileInputRef = useRef(null);
            const [syncModalOpen, setSyncModalOpen] = useState(false);
            const [syncMode, setSyncMode] = useState('send');
            const [syncCode, setSyncCode] = useState('');
            const [gameToDelete, setGameToDelete] = useState(null);

            const handleExport = () => {
                if (games.length === 0) {
                    showToast("İndirilecek veri bulunamadı.");
                    return;
                }
                const dataStr = JSON.stringify(games, null, 2);
                const blob = new Blob([dataStr], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `okey_masasi_yedek_${new Date().toLocaleDateString('tr-TR').replace(/\./g, '_')}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast("Yedekleme dosyası indirildi.");
            };

            const handleImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const imported = JSON.parse(event.target.result);
                        if (!Array.isArray(imported)) throw new Error("Geçersiz format");
                        if (confirm(`${imported.length} adet oyun verisi bulundu. Mevcut oyunların üzerine eklensin mi?`)) {
                            importGamesFn(imported);
                        }
                    } catch (err) {
                        alert("Dosya okunamadı. Lütfen geçerli bir Okey Masası yedek dosyası (.json) seçin.");
                    }
                };
                reader.readAsText(file);
                e.target.value = null; // Input sıfırlama
            };

            const openSyncSend = () => {
                if (games.length === 0) { showToast("Aktarılacak oyun yok."); return; }
                // Verileri güvenli bir şekilde metin koduna çevir (Base64)
                setSyncCode(btoa(encodeURIComponent(JSON.stringify(games))));
                setSyncMode('send');
            };

            const handleImportSyncCode = () => {
                try {
                    // Metin kodunu tekrar veriye dönüştür
                    const data = JSON.parse(decodeURIComponent(atob(syncCode.trim())));
                    if (!Array.isArray(data)) throw new Error();
                    importGamesFn(data);
                    setSyncModalOpen(false);
                } catch(e) {
                    alert("Hatalı veya eksik kod girdiniz! Lütfen kodun tamamını kopyaladığınızdan emin olun.");
                }
            };

            return (
                <div className="max-w-5xl mx-auto px-4 py-8 fade-in">
                    <div className="flex items-center gap-4 mb-8 border-b border-slate-200 dark:border-slate-700 pb-4">
                        <button onClick={() => navigate('home')} className="text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 bg-white dark:bg-slate-800 p-2.5 rounded-full shadow-sm border border-slate-200 dark:border-slate-700 transition-colors">
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                        </button>
                        <div><h1 className="text-2xl font-bold text-slate-800 dark:text-slate-100">Eski Oyunlarım</h1></div>
                    </div>
                    {games.length === 0 ? (
                        <div className="text-center py-20 bg-white dark:bg-slate-800 rounded-2xl border-2 border-dashed border-slate-200 dark:border-slate-700">
                            <h3 className="text-xl font-bold text-slate-700 dark:text-slate-200 mb-2">Oyun bulunamadı</h3>
                            <Button onClick={() => navigate('setup')} className="mx-auto mt-4">İlk Oyunu Kur</Button>
                        </div>
                    ) : (
                        <div className="grid md:grid-cols-2 gap-5">
                            {games.map(game => (
                                <Card key={game.id} className="cursor-pointer hover:shadow-lg transition-all hover:-translate-y-1 relative group" onClick={() => navigate(game.status === 'finished' ? 'results' : 'game', game.id)}>
                                    <div className="p-6">
                                        <div className="flex justify-between items-start mb-3">
                                            <h3 className="font-bold text-lg text-slate-800 dark:text-white">{game.title}</h3>
                                            <span className={`text-xs px-2.5 py-1 rounded-full font-bold shadow-sm ${game.status === 'active' ? 'bg-okey-100 text-okey-700' : 'bg-slate-100 text-slate-600'}`}>{game.status === 'active' ? 'Devam Ediyor' : 'Bitti'}</span>
                                        </div>
                                        <div className="text-sm text-slate-500 dark:text-slate-400 mb-6 flex flex-col gap-1.5">
                                            <span className="flex items-center gap-2"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg> {new Date(game.date).toLocaleDateString('tr-TR')}</span>
                                            <span className="flex items-center gap-2"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg> {GAME_TYPES.find(t=>t.id===game.type)?.name} • {game.mode === 'tekli' ? 'Bireysel' : 'Eşli'}</span>
                                        </div>
                                    </div>
                                    <button onClick={(e) => { e.stopPropagation(); setGameToDelete(game.id); }} className="absolute top-5 right-5 text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity p-1.5 bg-white rounded-full shadow border"><svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                                </Card>
                            ))}
                        </div>
                    )}
                    
                    <div className="mt-12">
                        <Card className="p-6 bg-slate-50 dark:bg-slate-800/50 border-dashed border-2">
                            <div className="flex flex-col md:flex-row items-center justify-between gap-6">
                                <div>
                                    <h3 className="text-lg font-bold text-slate-800 dark:text-white flex items-center gap-2 mb-1">
                                        <svg className="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
                                        Veri Yedekleme & Cihaz Eşleme
                                    </h3>
                                    <p className="text-sm text-slate-500 dark:text-slate-400">Tüm oyun geçmişinizi indirebilir veya özel bir kod aracılığıyla anında arkadaşınızın cihazına aktarabilirsiniz.</p>
                                </div>
                                <div className="flex flex-wrap gap-3 w-full md:w-auto">
                                    <Button variant="outline" onClick={() => { setSyncModalOpen(true); openSyncSend(); }} className="flex-1 md:flex-none border-okey-500 text-okey-600 hover:bg-okey-50 dark:border-okey-400 dark:text-okey-400">
                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
                                        Kod ile Aktar
                                    </Button>
                                    <Button variant="outline" onClick={handleExport} className="flex-1 md:flex-none">
                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                                        Dosya İndir
                                    </Button>
                                    <input type="file" accept=".json" ref={fileInputRef} onChange={handleImport} className="hidden" />
                                    <Button onClick={() => fileInputRef.current?.click()} className="flex-1 md:flex-none bg-blue-600 hover:bg-blue-700 text-white">
                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                                        Yükle
                                    </Button>
                                </div>
                            </div>
                        </Card>
                    </div>

                    <Modal isOpen={syncModalOpen} onClose={() => setSyncModalOpen(false)} title="Cihazlar Arası Kodla Aktarım">
                        <div className="flex border-b border-slate-200 dark:border-slate-700 mb-5 pb-2">
                            <button onClick={() => { setSyncMode('send'); openSyncSend(); }} className={`flex-1 pb-2 text-sm font-bold text-center border-b-2 transition-colors ${syncMode === 'send' ? 'border-okey-500 text-okey-600 dark:text-okey-400' : 'border-transparent text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'}`}>Kod Üret (Gönder)</button>
                            <button onClick={() => { setSyncMode('receive'); setSyncCode(''); }} className={`flex-1 pb-2 text-sm font-bold text-center border-b-2 transition-colors ${syncMode === 'receive' ? 'border-okey-500 text-okey-600 dark:text-okey-400' : 'border-transparent text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'}`}>Kod Gir (Al)</button>
                        </div>
                        
                        {syncMode === 'send' && (
                            <div className="space-y-4 fade-in">
                                <p className="text-sm text-slate-600 dark:text-slate-400 leading-relaxed">Aşağıdaki şifreli metni kopyalayıp WhatsApp gibi bir uygulamadan arkadaşınıza gönderin. O da kendi cihazında <strong className="text-slate-800 dark:text-slate-200">Kod Gir (Al)</strong> sekmesine bu metni yapıştırarak tüm geçmişinizi eşleyebilir.</p>
                                <div className="relative">
                                    <textarea readOnly value={syncCode} className="w-full h-36 p-3 text-xs bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-500 font-mono resize-none focus:outline-none custom-scrollbar" onClick={(e) => e.target.select()}></textarea>
                                </div>
                                <Button className="w-full py-3" onClick={() => { navigator.clipboard.writeText(syncCode); showToast("Aktarım kodu kopyalandı!"); setSyncModalOpen(false); }}>
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                                    Kodu Kopyala
                                </Button>
                            </div>
                        )}

                        {syncMode === 'receive' && (
                            <div className="space-y-4 fade-in">
                                <p className="text-sm text-slate-600 dark:text-slate-400 leading-relaxed">Arkadaşınızdan aldığınız upuzun aktarım kodunu aşağıdaki alana yapıştırın. Bu işlem mevcut oyunlarınızı silmez, sadece yeni oyunları listeye ekler.</p>
                                <textarea value={syncCode} onChange={e => setSyncCode(e.target.value)} placeholder="Kodu buraya yapıştırın..." className="w-full h-36 p-3 text-xs bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-xl text-slate-800 dark:text-slate-200 font-mono resize-none focus:ring-2 focus:ring-okey-500 outline-none"></textarea>
                                <Button className="w-full py-3" disabled={!syncCode.trim()} onClick={handleImportSyncCode}>
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                                    Verileri İçe Aktar (Birleştir)
                                </Button>
                            </div>
                        )}
                    </Modal>

                    <ConfirmModal 
                        isOpen={gameToDelete !== null} 
                        onClose={() => setGameToDelete(null)} 
                        onConfirm={() => { if(gameToDelete) deleteGameFn(gameToDelete); setGameToDelete(null); }} 
                        title="Oyunu Sil" 
                        message="Bu oyunu kalıcı olarak silmek istediğinize emin misiniz? Bu işlem geri alınamaz ve geçmişinizden silinir." 
                        variant="danger" 
                        confirmText="Evet, Sil" 
                    />
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('home');
            const [toast, setToast] = useState(null);
            
            // Firebase & Auth States
            const [isBooting, setIsBooting] = useState(true);
            const [fbApp, setFbApp] = useState(null);
            const [useCloud, setUseCloud] = useState(false);
            const [currentUser, setCurrentUser] = useState(null);
            const [profile, setProfile] = useState(null);
            
            // Proje kimliği tamamen yerel ve bağımsız hale getirildi
            const appId = 'okey-local'; 
            
            const [games, setGames] = useState([]);
            const [currentGameId, setCurrentGameId] = useState(null);
            const currentGame = useMemo(() => games.find(g => g.id === currentGameId), [games, currentGameId]);
            
            // İlk açılışta karanlık mod varsayılan olmasın (sadece kullanıcı önceden seçmişse olsun)
            const [isDark, setIsDark] = useState(() => {
                return localStorage.getItem('okey_theme') === 'dark';
            });

            useEffect(() => {
                if (isDark) document.documentElement.classList.add('dark'); else document.documentElement.classList.remove('dark');
                localStorage.setItem('okey_theme', isDark ? 'dark' : 'light');
            }, [isDark]);

            // App Boot / Firebase Connection Logic
            useEffect(() => {
                let attempts = 0;
                const boot = async () => {
                    if (window.initFirebase) {
                        const result = await window.initFirebase();
                        if (result) {
                            setFbApp(result);
                            setUseCloud(true);
                            window.FirebaseAPI.onAuthStateChanged(result.auth, async (user) => {
                                setCurrentUser(user);
                                if (user) {
                                    // Fetch user profile
                                    const pRef = window.FirebaseAPI.doc(result.db, 'artifacts', appId, 'users', user.uid, 'profile', 'main');
                                    const snap = await window.FirebaseAPI.getDoc(pRef);
                                    if (snap.exists()) setProfile(snap.data()); else setProfile({ name: '' });
                                    setIsBooting(false);
                                }
                            });
                        } else {
                            // Fallback to local
                            try { setGames(JSON.parse(localStorage.getItem('okey_games') || '[]')); } catch(e){}
                            setIsBooting(false);
                        }
                    } else {
                        attempts++;
                        if (attempts > 10) { try { setGames(JSON.parse(localStorage.getItem('okey_games') || '[]')); } catch(e){} setIsBooting(false); }
                        else setTimeout(boot, 100);
                    }
                };
                boot();
            }, []);

            // Firestore Games Listener (Eğer buluta bağlandıysa)
            useEffect(() => {
                if (!useCloud || !fbApp || !currentUser) return;
                const gamesRef = window.FirebaseAPI.collection(fbApp.db, 'artifacts', appId, 'public', 'data', 'games');
                const unsub = window.FirebaseAPI.onSnapshot(gamesRef, (snap) => {
                    const fetched = [];
                    snap.forEach(d => fetched.push(d.data()));
                    fetched.sort((a,b) => new Date(b.date) - new Date(a.date));
                    setGames(fetched);
                }, err => console.error(err));
                return () => unsub();
            }, [useCloud, fbApp, currentUser]);

            // Her ihtimale karşı lokal yedeği de güncelleyelim (Local Mode)
            useEffect(() => { if (!useCloud) localStorage.setItem('okey_games', JSON.stringify(games)); }, [games, useCloud]);

            const handleSaveProfile = async (name) => {
                if (useCloud && fbApp && currentUser) {
                    const pRef = window.FirebaseAPI.doc(fbApp.db, 'artifacts', appId, 'users', currentUser.uid, 'profile', 'main');
                    await window.FirebaseAPI.setDoc(pRef, { name });
                }
                setProfile({ name });
            };

            const saveGame = async (updatedGame) => {
                if (useCloud && fbApp) {
                    const ref = window.FirebaseAPI.doc(fbApp.db, 'artifacts', appId, 'public', 'data', 'games', updatedGame.id);
                    await window.FirebaseAPI.setDoc(ref, updatedGame);
                } else {
                    setGames(prev => prev.map(g => g.id === updatedGame.id ? updatedGame : g));
                }
            };

            const createGame = async (newGame) => {
                if (useCloud && fbApp) {
                    const ref = window.FirebaseAPI.doc(fbApp.db, 'artifacts', appId, 'public', 'data', 'games', newGame.id);
                    await window.FirebaseAPI.setDoc(ref, newGame);
                } else {
                    setGames([newGame, ...games]);
                }
                navigate('game', newGame.id);
            };

            const deleteGameFn = async (gameId) => {
                if (useCloud && fbApp) {
                    const ref = window.FirebaseAPI.doc(fbApp.db, 'artifacts', appId, 'public', 'data', 'games', gameId);
                    await window.FirebaseAPI.deleteDoc(ref);
                } else {
                    setGames(prev => prev.filter(g => g.id !== gameId));
                }
                showToast("Oyun başarıyla silindi.");
            };

            const importGamesFn = async (importedGames) => {
                let addedCount = 0;
                const newGames = [...games];
                for (const ig of importedGames) {
                    if (!newGames.find(g => g.id === ig.id)) {
                        newGames.push(ig);
                        addedCount++;
                        if (useCloud && fbApp) {
                            const ref = window.FirebaseAPI.doc(fbApp.db, 'artifacts', appId, 'public', 'data', 'games', ig.id);
                            await window.FirebaseAPI.setDoc(ref, ig);
                        }
                    }
                }
                if (!useCloud) {
                    setGames(newGames);
                }
                showToast(`${addedCount} adet yeni oyun geçmişe eklendi!`);
            };

            const navigate = (newView, gameId = null) => {
                if (gameId) setCurrentGameId(gameId);
                setView(newView);
                window.scrollTo(0, 0);
            };

            const showToast = (message) => { setToast(message); setTimeout(() => setToast(null), 3000); };

            if (isBooting) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-50 dark:bg-slate-900">
                         <div className="flex flex-col items-center gap-4">
                             <div className="w-12 h-12 border-4 border-okey-200 border-t-okey-600 rounded-full animate-spin"></div>
                             <p className="text-slate-500 font-medium">Bulut ortamı yükleniyor...</p>
                         </div>
                    </div>
                )
            }

            if (useCloud && profile && !profile.name) {
                return <ProfileSetup onSave={handleSaveProfile} />
            }

            return (
                <div className="min-h-screen flex flex-col relative transition-colors duration-300">
                    <Navbar navigate={navigate} isDark={isDark} toggleTheme={() => setIsDark(!isDark)} profile={profile} useCloud={useCloud} />
                    <main className="flex-1">
                        {view === 'home' && <HomeView navigate={navigate} games={games} />}
                        {view === 'setup' && <SetupView navigate={navigate} createGame={createGame} profileName={profile?.name} />}
                        {view === 'game' && <ActiveGameView navigate={navigate} currentGame={currentGame} saveGame={saveGame} showToast={showToast} />}
                        {view === 'results' && <ResultsView navigate={navigate} currentGame={currentGame} />}
                        {view === 'history' && <HistoryView navigate={navigate} games={games} deleteGameFn={deleteGameFn} importGamesFn={importGamesFn} showToast={showToast} />}
                        {view === 'stats' && <StatsView navigate={navigate} games={games} profileName={profile?.name} />}
                    </main>
                    {toast && (
                        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-2xl z-50 fade-in flex items-center gap-2 text-sm font-medium whitespace-nowrap">
                            <svg className="w-5 h-5 text-okey-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            {toast}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
