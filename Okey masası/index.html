                                <div key={r.entity.id} className={`flex justify-between items-center p-5 rounded-2xl border-2 transition-all ${i === 0 ? 'bg-yellow-50 border-yellow-200 scale-105 shadow-sm my-6' : 'bg-white border-slate-100 shadow-sm'}`}>
                                    <div className="flex items-center gap-4">
                                        <span className={`w-10 h-10 rounded-full flex items-center justify-center font-black text-lg ${i===0?'bg-yellow-400 text-yellow-900 shadow-inner':'bg-slate-100 text-slate-500'}`}>{i+1}</span>
                                        <span className={`font-bold ${i===0?'text-yellow-900 text-lg':'text-slate-700'}`}>{r.entity.name}</span>
                                    </div>
                                    <span className={`font-black text-xl ${i===0?'text-yellow-900':'text-slate-700'}`}>{r.score}</span>
                                </div>
                            ))}
                        </div>
                    </Card>
                );
            };

            return (
                <div className="max-w-4xl mx-auto px-4 py-12 fade-in">
                    <div className="text-center mb-10">
                        <span className="bg-slate-100 text-slate-600 px-3 py-1.5 rounded-full text-sm font-bold tracking-wide uppercase mb-4 inline-block">Oyun Bitti</span>
                        <h1 className="text-4xl font-black text-slate-800 mb-2">{currentGame.title}</h1>
                        <p className="text-slate-500 font-medium">{new Date(currentGame.date).toLocaleDateString('tr-TR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })} • {currentGame.tables.reduce((acc, t) => acc + t.rounds.length, 0)} El Oynandı</p>
                    </div>
                    {currentGame.tables.map(table => <div key={table.id}>{renderTableResult(table)}</div>)}
                    <div className="flex flex-col sm:flex-row gap-4 mt-10 justify-center border-t border-slate-200 pt-10">
                        <Button onClick={() => navigate('setup')} size="lg" className="w-full sm:w-auto">Yeniden Rövanş Başlat</Button>
                        <Button variant="secondary" onClick={() => navigate('history')} size="lg" className="w-full sm:w-auto border border-slate-200">Tüm Geçmişe Dön</Button>
                    </div>
                </div>
            );
        };

        const HistoryView = ({ navigate, games, setGames }) => {
            const [showDelete, setShowDelete] = useState(false);
            const [gameToDelete, setGameToDelete] = useState(null);

            const deleteGame = () => {
                if (gameToDelete) {
                    setGames(games.filter(g => g.id !== gameToDelete));
                    setGameToDelete(null);
                }
            };

            return (
                <div className="max-w-4xl mx-auto px-4 py-8 fade-in">
                    <div className="flex items-center gap-4 mb-8 border-b border-slate-200 pb-4">
                        <button onClick={() => navigate('home')} className="text-slate-400 hover:text-slate-700 bg-white p-2.5 rounded-full shadow-sm border border-slate-200 transition-colors">
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                        </button>
                        <div>
                            <h1 className="text-2xl font-bold text-slate-800">Eski Oyunlarım</h1>
                            <p className="text-sm text-slate-500">Önceki oyun kayıtlarınız tarayıcınızda saklanmaktadır.</p>
                        </div>
                    </div>

                    {games.length === 0 ? (
                        <div className="text-center py-20 bg-white rounded-2xl border-2 border-dashed border-slate-200">
                            <div className="text-slate-300 mb-4 flex justify-center">
                                <svg className="w-20 h-20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            </div>
                            <h3 className="text-xl font-bold text-slate-700 mb-2">Henüz kaydedilmiş oyun yok</h3>
                            <p className="text-slate-500 mb-8">Yeni bir oyun kurarak ilk kaydınızı oluşturun.</p>
                            <Button onClick={() => navigate('setup')} className="mx-auto" size="lg">Hemen Oyun Kur</Button>
                        </div>
                    ) : (
                        <div className="grid md:grid-cols-2 gap-5">
                            {games.map(game => (
                                <Card key={game.id} className="cursor-pointer hover:shadow-lg transition-all hover:-translate-y-1 hover:border-okey-300 group relative border-2 border-transparent bg-white ring-1 ring-slate-200" onClick={() => navigate(game.status === 'finished' ? 'results' : 'game', game.id)}>
                                    <div className="p-6">
                                        <div className="flex justify-between items-start mb-3">
                                            <h3 className="font-bold text-lg text-slate-800 truncate pr-10">{game.title}</h3>
                                            <span className={`text-xs px-2.5 py-1 rounded-full font-bold shadow-sm ${game.status === 'active' ? 'bg-okey-100 text-okey-700 border border-okey-200' : 'bg-slate-100 text-slate-600 border border-slate-200'}`}>
                                                {game.status === 'active' ? 'Devam Ediyor' : 'Bitti'}
                                            </span>
                                        </div>
                                        <div className="text-sm text-slate-500 mb-6 flex flex-col gap-1.5">
                                            <span className="flex items-center gap-2"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg> {new Date(game.date).toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' })}</span>
                                            <span className="flex items-center gap-2"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg> {GAME_TYPES.find(t=>t.id===game.type)?.name} {game.folding ? `(${game.folding === 'katlamali' ? 'Katlamalı' : 'Katlamasız'})` : ''} • {game.mode === 'tekli' ? 'Bireysel' : 'Eşli'}</span>
                                        </div>
                                        
                                        <div className="flex justify-between items-center text-sm pt-4 border-t border-slate-100">
                                            <span className="font-medium text-slate-600">{game.tables.length} Masa • {game.tables.reduce((acc, t) => acc + (t.mode === 'tekli' ? t.players.length : 4) + t.substitutes.length, 0)} Oyuncu</span>
                                            <span className="text-okey-600 font-bold group-hover:translate-x-1 transition-transform">{game.status === 'finished' ? 'Sonuçları Gör' : 'Oyuna Dön'} &rarr;</span>
                                        </div>
                                    </div>
                                    <button onClick={(e) => { e.stopPropagation(); setGameToDelete(game.id); setShowDelete(true); }} className="absolute top-5 right-5 text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity p-1.5 bg-white rounded-full shadow-sm border border-slate-100 hover:border-red-200" title="Oyunu Sil">
                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                    </button>
                                </Card>
                            ))}
                        </div>
                    )}

                    <ConfirmModal 
                        isOpen={showDelete} onClose={() => setShowDelete(false)} onConfirm={deleteGame}
                        title="Oyunu Sil" message="Bu oyunu geçmişten silmek istediğinize emin misiniz? Bu işlem geri alınamaz ve tüm puan kayıtları yok olur." variant="danger" confirmText="Kalıcı Olarak Sil"
                    />
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('home');
            const [toast, setToast] = useState(null);
            
            const [games, setGames] = useState(() => {
                try {
                    const saved = localStorage.getItem('okey_games');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) { return []; }
            });
            const [currentGameId, setCurrentGameId] = useState(null);

            useEffect(() => {
                try { localStorage.setItem('okey_games', JSON.stringify(games)); } catch (e) { console.error(e); }
            }, [games]);

            const currentGame = useMemo(() => games.find(g => g.id === currentGameId), [games, currentGameId]);

            const saveGame = (updatedGame) => {
                setGames(prev => prev.map(g => g.id === updatedGame.id ? updatedGame : g));
            };

            const navigate = (newView, gameId = null) => {
                if (gameId) setCurrentGameId(gameId);
                setView(newView);
                window.scrollTo(0, 0);
            };

            const showToast = (message) => {
                setToast(message);
                setTimeout(() => setToast(null), 3000);
            };

            return (
                <div className="min-h-screen flex flex-col relative">
                    <Navbar navigate={navigate} />
                    <main className="flex-1">
                        {view === 'home' && <HomeView navigate={navigate} games={games} />}
                        {view === 'setup' && <SetupView navigate={navigate} createGame={(g) => { setGames([g, ...games]); navigate('game', g.id); }} />}
                        {view === 'game' && <ActiveGameView navigate={navigate} currentGame={currentGame} saveGame={saveGame} showToast={showToast} />}
                        {view === 'results' && <ResultsView navigate={navigate} currentGame={currentGame} />}
                        {view === 'history' && <HistoryView navigate={navigate} games={games} setGames={setGames} />}
                    </main>
                    {toast && (
                        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-2xl z-50 fade-in flex items-center gap-2 text-sm font-medium border border-slate-700 whitespace-nowrap">
                            <svg className="w-5 h-5 text-okey-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            {toast}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
</body>
</html>
